<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sayansi: Kitabu cha Mwanafunzi, Darasa la Nne</title>
</head>
<body>
  <script>
    const requestedPage = Math.max(1, Number(location.hash.replace('#page-', '')) || 1);
    fetch('./content/pages.json')
      .then(response => response.json())
      .then(pages => {
        const selectedPage = pages[requestedPage - 1] || pages[0];
        location.replace(selectedPage.href);
      })
      .catch(() => location.replace('index.html'));
  </script>
</body>
</html>
